

services:

  app1:
    build: .
    container_name: app1
    ports:
      - "5001:5000"
    depends_on:
      - redis

  app2:
    build: .
    container_name: app2
    ports:
      - "5002:5000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2